[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Asistente de voz liviano para Windows: Hey Jarvis desde el casco, sin usar la placa de video."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "openwakeword==0.6.0",
    "onnx-asr[cpu,hub]>=0.12",
    "piper-tts>=1.3",
    "pystray>=0.19",
    "pillow>=10",
    "pynput>=1.7",
    "pycaw>=20240316",
    "psutil>=5.9",
    "pyyaml>=6",
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
